version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: rules
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro

  adminer:
    image: adminer
    restart: always
    ports: ["8081:8080"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PG_DSN: postgresql://app:app@db:5432/rules
      INDEX_PATH: /app/faiss.index
      EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
